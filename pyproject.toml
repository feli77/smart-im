[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "smart-im"
version = "0.2.0"
description = "Local AI candidate reranking for Rime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "lupa>=2.4,<3"]

[project.scripts]
smart-im = "smart_im.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_im"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
