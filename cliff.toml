[changelog]
header = """
# Changelog

Generated from Git history with git-cliff. Changes without a version tag appear under Unreleased.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    # Omit changelog-only/release commits so regenerating the log is stable.
    { message = '^chore\(release\)', skip = true },
    { message = '^docs\(changelog\)', skip = true },
    { message = '^feat', group = 'Features' },
    { message = '^fix', group = 'Bug Fixes' },
    { message = '^perf', group = 'Performance' },
    { message = '^refactor', group = 'Refactoring' },
    { message = '^docs', group = 'Documentation' },
    { message = '^test', group = 'Testing' },
    { message = '^(build|chore|ci|style)', group = 'Maintenance' },
    { message = '.*', group = 'Other' },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
sort_commits = 'oldest'
